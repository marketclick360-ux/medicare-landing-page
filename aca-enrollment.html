<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACA Enrollment | Edlando Insurance</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0d4f5c 0%,#1a6b7a 100%);min-height:100vh;padding:20px}.container{max-width:700px;margin:0 auto}.form-card{background:white;border-radius:16px;padding:40px;box-shadow:0 10px 40px rgba(0,0,0,0.2)}h1{color:#0d9488;font-size:1.8rem;margin-bottom:8px}.subtitle{color:#6b7280;margin-bottom:24px}.form-group{margin-bottom:20px}label{display:block;color:#374151;font-weight:500;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:8px;font-size:1rem}input:focus,select:focus,textarea:focus{outline:none;border-color:#0d9488}.btn{padding:14px 28px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;background:#0d9488;color:white}.btn:hover{background:#0f766e}.required{color:#ef4444}.site-header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;margin-bottom:20px}.header-left a,.header-right a{display:inline-flex;align-items:center;gap:8px;color:white;text-decoration:none;font-weight:600;padding:10px 20px;border-radius:8px}.header-left a{background:rgba(255,255,255,0.15)}.header-right a{background:#f97316}
</style>
</head>
<body>
<header class="site-header">
<div class="header-left"><a href="index.html">🏠 Home</a></div>
<div class="header-right"><a href="tel:+18326808257">📞 Call (832) 680-8257</a></div>
</header>
<div class="container">
<div class="form-card">
<h1>ACA Enrollment Application</h1>
<p class="subtitle">Affordable Care Act Health Insurance Enrollment</p>
<form id="acaForm">
<div class="form-group"><label>Full Name <span class="required">*</span></label><input type="text" name="fullName" required></div>
<div class="form-group"><label>Date of Birth <span class="required">*</span></label><input type="date" name="dob" required></div>
<div class="form-group"><label>Social Security Number <span class="required">*</span></label><input type="text" name="ssn" placeholder="###-##-####" required></div>
<div class="form-group"><label>Email <span class="required">*</span></label><input type="email" name="email" required></div>
<div class="form-group"><label>Phone <span class="required">*</span></label><input type="tel" name="phone" required></div>
<div class="form-group"><label>State <span class="required">*</span></label><select name="state" required><option value="">Select State...</option><option>Texas</option><option>California</option><option>Florida</option><option>New York</option></select></div>
<div class="form-group"><label>Household Size <span class="required">*</span></label><input type="number" name="householdSize" min="1" required></div>
<div class="form-group"><label>Annual Household Income <span class="required">*</span></label><input type="number" name="householdIncome" required></div>
<div class="form-group"><label>Current Coverage Status</label><select name="currentCoverage"><option>No Coverage</option><option>Employer Coverage</option><option>Medicaid</option><option>Medicare</option></select></div>
<div class="form-group"><label>Prescription Medications</label><textarea name="prescriptionMedications" rows="3" placeholder="List any regular medications..."></textarea></div>
<div class="form-group"><label>Preferred Start Date</label><input type="date" name="preferredStartDate"></div>
<div class="form-group"><label>Additional Notes</label><textarea name="notes" rows="3"></textarea></div>
<button type="submit" class="btn">Submit Application ✓</button>
</form>
</div>
</div>
<script>
document.getElementById('acaForm').addEventListener('submit',async function(e){
e.preventDefault();
const formData=new FormData(e.target);
const data={
fullName:formData.get('fullName'),
dob:formData.get('dob'),
ssn:formData.get('ssn'),
email:formData.get('email'),
phone:formData.get('phone'),
state:formData.get('state'),
householdSize:formData.get('householdSize'),
householdIncome:formData.get('householdIncome'),
currentCoverage:formData.get('currentCoverage'),
prescriptionMedications:formData.get('prescriptionMedications'),
preferredStartDate:formData.get('preferredStartDate'),
notes:formData.get('notes')
};
try{
const response=await fetch('/api/aca-enrollment',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(data)
});
if(response.ok){
alert('Application submitted successfully! We will contact you soon.');
e.target.reset();
}else{
alert('Error submitting form. Please try again.');
}
}catch(error){
alert('Network error. Please check your connection.');
}
});
</script>
</body>
</html>
